name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build installable release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter environment
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Prepare Android Gradle wrapper
        run: bash tool/bootstrap_android_wrapper.sh

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Install Android NDK 29
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" "ndk;29.0.13113456"
          test -d "$ANDROID_HOME/ndk/29.0.13113456"

      - name: Build release APK
        run: flutter build apk --release

      - name: Validate APK archive and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.hifzjourney.app'" apk-badging.txt
          grep -q "application-label:'Hifz Journey'" apk-badging.txt
          grep -q "application-icon-" apk-badging.txt

      - name: Collect APK
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/Hifz-Journey.apk
          cp apk-badging.txt release/apk-badging.txt
          sha256sum release/Hifz-Journey.apk | tee release/Hifz-Journey.apk.sha256
          ls -lh release/Hifz-Journey.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hifz-Journey-APK
          path: |
            release/Hifz-Journey.apk
            release/Hifz-Journey.apk.sha256
            release/apk-badging.txt
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Hifz-Journey.apk
            release/Hifz-Journey.apk.sha256
