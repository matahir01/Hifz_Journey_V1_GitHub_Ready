name: Build Android Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build optimized Android release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter environment
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Prepare Android Gradle wrapper
        run: bash tool/bootstrap_android_wrapper.sh

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Preserve CI test signing key
        if: ${{ env.ANDROID_KEYSTORE_BASE64 == '' }}
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: hifz-journey-ci-signing-v1

      - name: Prepare permanent release signing
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/hifz-release.jks
          test -s android/app/hifz-release.jks

      - name: Build optimized split APKs
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/hifz-release.jks
        run: flutter build apk --release --split-per-abi

      - name: Build Play Store app bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/hifz-release.jks
        run: flutter build appbundle --release

      - name: Validate Android artifacts
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          mkdir -p release

          found=0
          for APK in build/app/outputs/flutter-apk/*-release.apk; do
            [ -f "$APK" ] || continue
            found=1
            unzip -t "$APK" >/dev/null
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
            BADGING="$($ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt dump badging "$APK")"
            echo "$BADGING" | grep -q "package: name='com.hifzjourney.app'"
            echo "$BADGING" | grep -q "application-label:'Hifz Journey'"
            cp "$APK" "release/$(basename "$APK")"
          done
          test "$found" -eq 1

          AAB="build/app/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          cp "$AAB" release/Hifz-Journey.aab

          (cd release && sha256sum *.apk *.aab > SHA256SUMS.txt)
          ls -lh release/

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Hifz-Journey-Android
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Attach Android files to tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.apk
            release/Hifz-Journey.aab
            release/SHA256SUMS.txt
